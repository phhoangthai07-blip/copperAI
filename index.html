<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Workspace Assistant</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0f7ff',
                            100: '#e0effe',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        /* Custom scrollbar styling for slick look */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(156, 163, 175, 0.4);
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(156, 163, 175, 0.7);
        }
        .typing-dot {
            animation: typing 1.4s infinite ease-in-out both;
        }
        .typing-dot:nth-child(1) { animation-delay: 0s; }
        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes typing {
            0%, 80%, 100% { transform: scale(0); opacity: 0.3; }
            40% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 dark:bg-gray-900 dark:text-gray-100 font-sans h-screen flex flex-col transition-colors duration-200">

    <!-- Top Header -->
    <header class="h-16 border-b border-gray-200 dark:border-gray-800 bg-white/80 dark:bg-gray-900/80 backdrop-blur-md px-4 flex items-center justify-between shrink-0 z-10">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-blue-600 to-indigo-500 flex items-center justify-center text-white shadow-md shadow-blue-500/20">
                <i class="fa-solid fa-sparkles text-lg"></i>
            </div>
            <div>
                <h1 class="font-bold text-base leading-tight">Nexus AI Assistant</h1>
                <p class="text-xs text-gray-500 dark:text-gray-400 flex items-center gap-1">
                    <span class="w-2 h-2 rounded-full bg-emerald-500 inline-block animate-pulse"></span> Powered by Gemini 3 Flash
                </p>
            </div>
        </div>

        <div class="flex items-center space-x-2">
            <!-- Clear Chat Button -->
            <button id="clearChatBtn" title="Clear Conversation" class="p-2 rounded-lg text-gray-500 hover:text-gray-700 dark:text-gray-400 dark:hover:text-gray-200 hover:bg-gray-100 dark:hover:bg-gray-800 transition">
                <i class="fa-regular fa-trash-can"></i>
            </button>
            <!-- Dark Mode Toggle -->
            <button id="themeToggle" title="Toggle Theme" class="p-2 rounded-lg text-gray-500 hover:text-gray-700 dark:text-gray-400 dark:hover:text-gray-200 hover:bg-gray-100 dark:hover:bg-gray-800 transition">
                <i class="fa-solid fa-moon dark:hidden"></i>
                <i class="fa-solid fa-sun hidden dark:block text-amber-400"></i>
            </button>
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-1 overflow-hidden flex flex-col max-w-4xl w-full mx-auto p-2 sm:p-4">
        
        <!-- Chat Messages Container -->
        <div id="chatContainer" class="flex-1 overflow-y-auto space-y-4 p-2 sm:p-4">
            
            <!-- Welcome Message -->
            <div class="flex items-start gap-3 max-w-[85%]">
                <div class="w-8 h-8 rounded-full bg-blue-600 text-white flex items-center justify-center shrink-0 text-sm font-semibold shadow">
                    AI
                </div>
                <div class="bg-white dark:bg-gray-800 border border-gray-100 dark:border-gray-700/60 p-4 rounded-2xl rounded-tl-none shadow-sm space-y-2">
                    <p class="text-sm leading-relaxed">
                        Hello! I am your AI assistant powered by Gemini. How can I help you today?
                    </p>
                    <div class="flex flex-wrap gap-2 pt-2">
                        <button onclick="sendQuickPrompt('Explain quantum computing in simple terms')" class="text-xs bg-gray-100 dark:bg-gray-700/60 hover:bg-blue-50 dark:hover:bg-blue-900/30 hover:text-blue-600 dark:hover:text-blue-400 border border-gray-200 dark:border-gray-600/50 px-3 py-1.5 rounded-full transition">
                            💡 Explain quantum physics
                        </button>
                        <button onclick="sendQuickPrompt('Write a Python function to quicksort an array')" class="text-xs bg-gray-100 dark:bg-gray-700/60 hover:bg-blue-50 dark:hover:bg-blue-900/30 hover:text-blue-600 dark:hover:text-blue-400 border border-gray-200 dark:border-gray-600/50 px-3 py-1.5 rounded-full transition">
                            💻 Write a Quicksort function
                        </button>
                        <button onclick="sendQuickPrompt('Draft a concise follow-up email after a job interview')" class="text-xs bg-gray-100 dark:bg-gray-700/60 hover:bg-blue-50 dark:hover:bg-blue-900/30 hover:text-blue-600 dark:hover:text-blue-400 border border-gray-200 dark:border-gray-600/50 px-3 py-1.5 rounded-full transition">
                            ✉️ Write follow-up email
                        </button>
                    </div>
                </div>
            </div>

        </div>

        <!-- Typing Indicator Container (Hidden by default) -->
        <div id="typingIndicator" class="hidden flex items-start gap-3 max-w-[85%] px-2 sm:px-4 py-2">
            <div class="w-8 h-8 rounded-full bg-blue-600 text-white flex items-center justify-center shrink-0 text-sm font-semibold shadow">
                AI
            </div>
            <div class="bg-white dark:bg-gray-800 border border-gray-100 dark:border-gray-700/60 px-4 py-3 rounded-2xl rounded-tl-none shadow-sm flex items-center space-x-1.5">
                <span class="w-2 h-2 bg-gray-400 dark:bg-gray-500 rounded-full typing-dot"></span>
                <span class="w-2 h-2 bg-gray-400 dark:bg-gray-500 rounded-full typing-dot"></span>
                <span class="w-2 h-2 bg-gray-400 dark:bg-gray-500 rounded-full typing-dot"></span>
            </div>
        </div>

        <!-- Input Box Area -->
        <div class="pt-2">
            <form id="chatForm" class="relative flex items-center">
                <textarea 
                    id="userInput" 
                    rows="1"
                    placeholder="Type your prompt here..." 
                    class="w-full resize-none rounded-2xl border border-gray-300 dark:border-gray-700 bg-white dark:bg-gray-800 pl-4 pr-12 py-3.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 dark:focus:ring-blue-500 shadow-lg dark:shadow-gray-950/20 max-h-36"
                    onkeydown="handleKeyDown(event)"></textarea>
                
                <button 
                    type="submit" 
                    id="sendBtn"
                    class="absolute right-2.5 p-2 rounded-xl bg-blue-600 hover:bg-blue-700 text-white transition disabled:opacity-50 disabled:cursor-not-allowed shadow-md shadow-blue-500/20">
                    <i class="fa-solid fa-arrow-up text-sm w-4 h-4 flex items-center justify-center"></i>
                </button>
            </form>
            <p class="text-[11px] text-center text-gray-400 dark:text-gray-500 mt-2">
                Gemini may display inaccurate info, so double-check its responses.
            </p>
        </div>

    </main>

    <!-- Application Logic Script -->
    <script>
        // API Configuration
        const apiKey = "AQ.Ab8RN6I-OnKwpXcp8qCrlEqgL8BHw3rKBBNQowMOKqnlSq4LGA"; // API Key handled seamlessly at runtime
        const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;

        // Chat History to store conversation state
        let chatHistory = [];

        // DOM Element Selectors
        const chatContainer = document.getElementById('chatContainer');
        const chatForm = document.getElementById('chatForm');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const typingIndicator = document.getElementById('typingIndicator');
        const themeToggle = document.getElementById('themeToggle');
        const clearChatBtn = document.getElementById('clearChatBtn');

        // Auto-expand textarea height
        userInput.addEventListener('input', () => {
            userInput.style.height = 'auto';
            userInput.style.height = Math.min(userInput.scrollHeight, 144) + 'px';
        });

        // Toggle Dark/Light Theme
        themeToggle.addEventListener('click', () => {
            document.documentElement.classList.toggle('dark');
        });

        // Clear Chat Conversation
        clearChatBtn.addEventListener('click', () => {
            chatHistory = [];
            chatContainer.innerHTML = `
                <div class="flex items-start gap-3 max-w-[85%]">
                    <div class="w-8 h-8 rounded-full bg-blue-600 text-white flex items-center justify-center shrink-0 text-sm font-semibold shadow">
                        AI
                    </div>
                    <div class="bg-white dark:bg-gray-800 border border-gray-100 dark:border-gray-700/60 p-4 rounded-2xl rounded-tl-none shadow-sm space-y-2">
                        <p class="text-sm leading-relaxed">
                            Chat cleared! How can I assist you now?
                        </p>
                    </div>
                </div>
            `;
        });

        // Submit message on Enter (Shift+Enter for new line)
        function handleKeyDown(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                chatForm.dispatchEvent(new Event('submit'));
            }
        }

        // Quick Prompt Selection
        function sendQuickPrompt(promptText) {
            userInput.value = promptText;
            chatForm.dispatchEvent(new Event('submit'));
        }

        // Add Bubble to Chat Display
        function appendMessage(role, text) {
            const isUser = role === 'user';
            const msgWrapper = document.createElement('div');
            msgWrapper.className = `flex items-start gap-3 ${isUser ? 'flex-row-reverse self-end' : ''} max-w-[85%]`;

            const avatar = document.createElement('div');
            avatar.className = `w-8 h-8 rounded-full ${isUser ? 'bg-gray-700 dark:bg-gray-600' : 'bg-blue-600'} text-white flex items-center justify-center shrink-0 text-sm font-semibold shadow`;
            avatar.innerText = isUser ? 'You' : 'AI';

            const bubble = document.createElement('div');
            bubble.className = isUser 
                ? 'bg-blue-600 text-white p-3.5 rounded-2xl rounded-tr-none shadow-sm text-sm leading-relaxed whitespace-pre-wrap' 
                : 'bg-white dark:bg-gray-800 border border-gray-100 dark:border-gray-700/60 p-4 rounded-2xl rounded-tl-none shadow-sm text-sm leading-relaxed whitespace-pre-wrap';
            
            bubble.textContent = text;

            msgWrapper.appendChild(avatar);
            msgWrapper.appendChild(bubble);
            chatContainer.appendChild(msgWrapper);

            // Auto scroll to bottom
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        // Show/Hide Typing Indicator
        function setTyping(isTyping) {
            if (isTyping) {
                typingIndicator.classList.remove('hidden');
                chatContainer.scrollTop = chatContainer.scrollHeight;
            } else {
                typingIndicator.classList.add('hidden');
            }
        }

        // API Call with Exponential Backoff retry strategy
        async function fetchGeminiResponse(payload, retries = 3, delay = 1000) {
            try {
                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) {
                    throw new Error(`API Error: ${response.status}`);
                }

                const data = await response.json();
                return data;
            } catch (err) {
                if (retries > 0) {
                    await new Promise(res => setTimeout(res, delay));
                    return fetchGeminiResponse(payload, retries - 1, delay * 2);
                }
                throw err;
            }
        }

        // Form Submit Handler
        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const text = userInput.value.trim();
            if (!text) return;

            // Reset textarea height & clear input
            userInput.value = '';
            userInput.style.height = 'auto';

            // Display User Message
            appendMessage('user', text);

            // Update conversation history
            chatHistory.push({ role: 'user', parts: [{ text: text }] });

            // Disable UI elements while generating
            sendBtn.disabled = true;
            userInput.disabled = true;
            setTyping(true);

            // Payload assembly
            const payload = {
                contents: chatHistory,
                systemInstruction: {
                    parts: [{ text: "You are a helpful, professional, friendly, and concise AI assistant." }]
                }
            };

            try {
                const result = await fetchGeminiResponse(payload);
                const candidate = result.candidates?.[0];
                const replyText = candidate?.content?.parts?.[0]?.text || "Sorry, I couldn't process your request.";

                // Save assistant reply to history
                chatHistory.push({ role: 'model', parts: [{ text: replyText }] });

                // Render assistant response
                appendMessage('model', replyText);
            } catch (error) {
                console.error("Gemini Request Error:", error);
                appendMessage('model', "⚠️ Connection error: Failed to fetch response from Gemini. Please check your network and try again.");
            } finally {
                // Re-enable UI elements
                setTyping(false);
                sendBtn.disabled = false;
                userInput.disabled = false;
                userInput.focus();
            }
        });
    </script>
</body>
</html>
